<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2315이채헌</title>
  <style>
    :root{
      --text:#f6f2ea;
      --shadow: 0 18px 40px rgba(0,0,0,.45);
      --pixel-border:
        0 0 0 2px #0a0a0f,
        0 0 0 4px #3a3148,
        0 0 0 6px #0a0a0f;
    }

    * { box-sizing:border-box; }

    html, body{
      margin:0;
      padding:0;
      background:
        radial-gradient(circle at top, #1a1e2d 0%, #090a10 55%, #05060a 100%);
      color:var(--text);
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      min-height:100%;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
    }

    .screen-wrap{
      width:min(100%, 1440px);
      aspect-ratio:16 / 9;
      position:relative;
      border-radius:14px;
      overflow:hidden;
      background:#000;
      box-shadow:
        0 0 0 2px #0c0d14,
        0 0 0 6px #24283a,
        0 0 0 10px #0c0d14,
        0 22px 58px rgba(0,0,0,.55);
      animation: boot .7s ease;
    }

    @keyframes boot{
      from{ opacity:0; transform:translateY(8px) scale(.985); }
      to{ opacity:1; transform:none; }
    }

    .background{
      position:absolute;
      inset:0;
      background-image:url('./bg.png');
      background-size:cover;
      background-position:center;
      transform:scale(1.02);
      filter:saturate(0.95) contrast(1.04);
    }

    .background::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(to bottom, rgba(0,0,0,.08), rgba(0,0,0,.18) 45%, rgba(0,0,0,.56)),
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.035) 0px,
          rgba(255,255,255,.035) 1px,
          transparent 1px,
          transparent 3px
        );
      pointer-events:none;
    }

    .background::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(90deg, rgba(12,13,20,.55), transparent 16%, transparent 84%, rgba(12,13,20,.55)),
        linear-gradient(180deg, rgba(12,13,20,.22), transparent 20%, transparent 80%, rgba(12,13,20,.65));
      pointer-events:none;
    }

    .mood-tint{
      position:absolute;
      inset:0;
      z-index:1;
      opacity:0;
      mix-blend-mode:color;
      transition:opacity .35s ease, background .35s ease;
      pointer-events:none;
    }

    .mood-tint.show{ opacity:.85; }

    .mood-tint.mood-1{ background:linear-gradient(160deg, hsl(30, 75%, 55%), hsl(20, 65%, 40%)); }
    .mood-tint.mood-2{ background:linear-gradient(160deg, hsl(38, 40%, 45%), hsl(30, 30%, 30%)); }
    .mood-tint.mood-3{ background:linear-gradient(160deg, hsl(208, 25%, 45%), hsl(210, 20%, 28%)); }
    .mood-tint.mood-4{ background:linear-gradient(160deg, hsl(232, 55%, 45%), hsl(250, 45%, 25%)); }
    .mood-tint.mood-5{ background:linear-gradient(160deg, hsl(184, 45%, 40%), hsl(190, 40%, 24%)); }

    .overlay{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.14);
      z-index:4;
      opacity:0;
      transition:opacity .24s ease;
      pointer-events:none;
    }

    .overlay.dark{
      opacity:1;
      background:rgba(0,0,0,.45);
    }

    .hud{
      position:absolute;
      inset:14px 16px auto 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      z-index:5;
    }

    .hud-left{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .badge, .progress-shell{
      background:rgba(14,15,22,.82);
      border:1px solid #3a3148;
      box-shadow: var(--pixel-border);
      padding:10px 14px;
      backdrop-filter: blur(6px);
    }

    .badge{
      font-weight:700;
      font-size:14px;
      color:#eadfc8;
      letter-spacing:.03em;
    }

    button.badge{
      font-family:inherit;
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
    }

    button.badge:hover{ filter:brightness(1.1); }

    .progress-shell{
      min-width:min(44vw, 420px);
      display:flex;
      align-items:center;
      gap:12px;
    }

    .progress-bar{
      flex:1;
      height:14px;
      background:#0f1320;
      border:1px solid #445074;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.04);
      position:relative;
      overflow:hidden;
    }

    .progress-fill{
      position:absolute;
      top:0;
      left:0;
      bottom:0;
      width:0%;
      background:
        repeating-linear-gradient(
          90deg,
          #87a4ff 0px, #87a4ff 10px,
          #b7cbff 10px, #b7cbff 20px
        );
      transition: width .35s ease;
    }

    .progress-text{
      width:72px;
      text-align:right;
      font-size:13px;
      color:#d8d3c9;
      font-weight:700;
    }

    .dialogue-box{
      position:absolute;
      left:16px;
      right:16px;
      bottom:16px;
      min-height:190px;
      display:grid;
      grid-template-columns:152px 1fr auto;
      background:rgba(15,16,24,.90);
      border:1px solid #40344c;
      box-shadow: var(--pixel-border), 0 12px 30px rgba(0,0,0,.35);
      z-index:7;
      overflow:hidden;
    }

    .portrait-panel{
      border-right:1px solid #40344c;
      background:
        linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.00)),
        #11141d;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding:0;
      position:relative;
    }

    .portrait-panel::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, transparent, rgba(0,0,0,.18)),
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,.02) 0px,
          rgba(255,255,255,.02) 1px,
          transparent 1px,
          transparent 4px
        );
      pointer-events:none;
    }

    .portrait{
      max-width:100%;
      max-height:184px;
      object-fit:contain;
      display:block;
      image-rendering:pixelated;
      filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));
      animation: idleBob 3.2s ease-in-out infinite;
    }

    @keyframes idleBob{
      0%, 100%{ transform:translateY(4px); }
      50%{ transform:translateY(-2px); }
    }

    .text-panel{
      padding:16px 20px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      min-width:0;
    }

    .name-tag{
      display:inline-block;
      width:fit-content;
      background:#f7efe2;
      color:#141722;
      font-weight:800;
      padding:6px 12px;
      margin-bottom:12px;
      box-shadow:
        0 0 0 2px #f7efe2,
        0 0 0 4px #141722;
      font-size:18px;
    }

    .dialogue{
      white-space:pre-wrap;
      line-height:1.74;
      font-size:clamp(17px, 1.38vw, 29px);
      min-height:92px;
      color:var(--text);
      text-shadow:0 1px 0 rgba(0,0,0,.18);
      opacity:0;
      transform:translateY(4px);
      transition: opacity .24s ease, transform .24s ease;
    }

    .dialogue.show{
      opacity:1;
      transform:none;
    }

    .side-actions{
      width:130px;
      display:flex;
      align-items:flex-end;
      justify-content:flex-end;
      padding:14px;
      border-left:1px solid #40344c;
      background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,.05));
    }

    .pixel-btn{
      border:none;
      padding:12px 16px;
      font-size:16px;
      font-weight:800;
      color:#11151f;
      background:
        linear-gradient(180deg, #f4ddaf, #d7af67);
      cursor:pointer;
      box-shadow:
        0 0 0 2px #201b27,
        0 0 0 4px #e5c88a,
        0 6px 0 #7f6233;
      transition: transform .08s ease, filter .18s ease, opacity .18s ease;
    }

    .pixel-btn:hover{ filter:brightness(1.03); }
    .pixel-btn:active{
      transform:translateY(2px);
      box-shadow:
        0 0 0 2px #201b27,
        0 0 0 4px #e5c88a,
        0 4px 0 #7f6233;
    }

    .pixel-btn[disabled]{ opacity:.45; cursor:not-allowed; }

    .center-layer{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:26px;
      z-index:6;
      pointer-events:none;
    }

    .card{
      width:min(100%, 860px);
      background:rgba(17,19,29,.95);
      border:1px solid #4a3a57;
      box-shadow:
        0 0 0 2px #0b0d14,
        0 0 0 6px #33283c,
        0 24px 50px rgba(0,0,0,.45);
      padding:26px 28px;
      opacity:0;
      transform:translateY(8px) scale(.985);
      transition: opacity .24s ease, transform .24s ease;
      pointer-events:auto;
      display:none;
      position:relative;
      max-height:90%;
      overflow-y:auto;
    }

    .card.show{
      display:block;
      opacity:1;
      transform:none;
    }

    .card-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      margin-bottom:14px;
      flex-wrap:wrap;
    }

    .card-badge{
      display:inline-block;
      padding:7px 10px;
      background:#202737;
      border:1px solid #53627f;
      color:#dfe8ff;
      font-weight:700;
      font-size:13px;
      box-shadow:0 0 0 2px #0d111a;
    }

    .score-chip{
      display:inline-block;
      padding:7px 10px;
      background:#202720;
      border:1px solid #5b7a5a;
      color:#e5ffe4;
      font-weight:700;
      font-size:13px;
      box-shadow:0 0 0 2px #0d111a;
    }

    .streak-chip{
      background:#2a2016;
      border-color:#a97c3a;
      color:#ffe3b0;
    }

    .score-toast{
      position:absolute;
      top:70px;
      right:28px;
      z-index:30;
      font-size:28px;
      font-weight:900;
      color:#9ad6a6;
      opacity:0;
      transform:translateY(10px) scale(.8);
      transition:opacity .25s ease, transform .25s ease;
      text-shadow:0 2px 8px rgba(0,0,0,.5);
      pointer-events:none;
    }

    .score-toast.show{
      opacity:1;
      transform:translateY(-10px) scale(1.15);
    }

    .confetti-piece{
      position:absolute;
      top:-10px;
      width:8px;
      height:14px;
      opacity:.9;
      animation-name:confettiFall;
      animation-timing-function:ease-in;
      animation-fill-mode:forwards;
      pointer-events:none;
    }

    @keyframes confettiFall{
      0%{ transform:translateY(0) rotate(0deg); opacity:1; }
      100%{ transform:translateY(340px) rotate(340deg); opacity:0; }
    }

    .card h2{
      margin:10px 0 14px;
      font-size:clamp(28px, 2.4vw, 42px);
      line-height:1.2;
      color:#fff7e6;
      letter-spacing:-.02em;
    }

    .meta{
      display:grid;
      grid-template-columns:120px 1fr;
      gap:10px 14px;
      margin-bottom:18px;
      font-size:clamp(15px, 1.08vw, 18px);
    }

    .meta .label{
      color:#b3bfd8;
      font-weight:800;
    }

    .meta .value{
      color:#f0ede6;
      line-height:1.6;
    }

    .rubric-note{
      color:#9aa4c2;
      font-size:.85em;
      display:inline-block;
      margin-top:4px;
    }

    .criteria-hint{
      margin:8px 0 4px;
      font-size:14px;
      color:#b9c3e0;
    }

    .criteria-list{
      margin:16px 0;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .criteria-row{
      display:flex;
      align-items:flex-start;
      gap:10px;
      padding:10px 12px;
      background:#111825;
      border:1px solid #364258;
    }

    .criteria-mark{
      flex:none;
      width:28px;
      height:28px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-size:15px;
      color:#0b0d14;
    }

    .criteria-mark.ok{ background:#9ad6a6; }
    .criteria-mark.warn{ background:#f0d17a; }
    .criteria-mark.no{ background:#f4a7a7; }

    .criteria-label{
      flex:none;
      width:78px;
      font-weight:800;
      color:#dfe8ff;
    }

    .criteria-note{
      color:#c9d0e6;
      font-size:14px;
      line-height:1.5;
    }

    .question{
      margin-top:18px;
      padding:16px 18px;
      background:#111825;
      border:1px solid #4e617b;
      color:#ffffff;
      line-height:1.65;
      font-size:clamp(18px, 1.2vw, 23px);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.04);
    }

    .choice-row{
      display:flex;
      justify-content:center;
      gap:16px;
      margin-top:22px;
      flex-wrap:wrap;
    }

    .choice-btn{
      min-width:132px;
      padding:16px 24px;
      font-size:22px;
      font-weight:900;
      border:none;
      cursor:pointer;
      color:#141722;
      transition: transform .08s ease, filter .18s ease;
    }

    .choice-btn.o{
      background:linear-gradient(180deg, #dffbe4, #9ad6a6);
      box-shadow:
        0 0 0 2px #1e2b20,
        0 0 0 4px #c4efca,
        0 6px 0 #4a7c53;
    }

    .choice-btn.x{
      background:linear-gradient(180deg, #ffe2e2, #f4a7a7);
      box-shadow:
        0 0 0 2px #2b1e20,
        0 0 0 4px #ffd2d2,
        0 6px 0 #8a4a4a;
    }

    .choice-btn:hover{ filter:brightness(1.03); }
    .choice-btn:active{ transform:translateY(2px); }
    .choice-btn[disabled]{ opacity:.4; cursor:not-allowed; }

    .result-flash{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      background:rgba(10,11,16,.94);
      opacity:0;
      transform:scale(.92);
      transition:opacity .18s ease, transform .18s ease;
      z-index:2;
    }

    .result-flash.show{ opacity:1; transform:none; }

    .result-flash .result-icon{
      font-size:64px;
      font-weight:900;
    }

    .result-flash.correct .result-icon{ color:#9ad6a6; }
    .result-flash.wrong .result-icon{ color:#f4a7a7; }

    .result-flash .result-text{
      font-size:20px;
      font-weight:800;
      color:#fff;
    }

    .title-card, .ending-card{
      text-align:center;
      padding:10px 4px;
    }

    .title-card h1, .ending-card h1{
      margin:8px 0 12px;
      font-size:clamp(32px, 2.8vw, 48px);
      color:#fff2d4;
      letter-spacing:-.03em;
    }

    .title-card p, .ending-card p{
      white-space:pre-wrap;
      line-height:1.75;
      color:#d8d2c8;
      font-size:clamp(16px, 1.1vw, 20px);
      margin:0 auto 18px;
      max-width:660px;
    }

    .ending-score{
      margin:22px 0 18px;
      font-size:clamp(24px, 1.9vw, 34px);
      font-weight:900;
      color:#fff4d2;
    }

    .rubric-modal{
      position:absolute;
      inset:0;
      z-index:20;
      display:none;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:rgba(4,5,9,.72);
      backdrop-filter: blur(2px);
    }

    .rubric-modal.show{ display:flex; }

    .rubric-modal-card{
      width:min(100%, 720px);
      max-height:88%;
      overflow-y:auto;
      background:rgba(17,19,29,.97);
      border:1px solid #4a3a57;
      box-shadow:
        0 0 0 2px #0b0d14,
        0 0 0 6px #33283c,
        0 24px 50px rgba(0,0,0,.45);
      padding:24px 26px;
      color:var(--text);
    }

    .hidden{ display:none !important; }

    @media (max-width: 960px){
      .screen-wrap{
        aspect-ratio:auto;
        height:90vh;
      }
      .dialogue-box{
        grid-template-columns:110px 1fr;
      }
      .side-actions{
        grid-column:1 / -1;
        width:auto;
        border-left:none;
        border-top:1px solid #40344c;
      }
      .portrait{ max-height:130px; }
      .name-tag{ font-size:16px; }
      .dialogue{ font-size:clamp(16px, 2.5vw, 22px); min-height:84px; }
    }

    @media (max-width: 560px){
      body{ padding:8px; }
      .hud{
        inset:10px 10px auto 10px;
        gap:8px;
        flex-wrap:wrap;
      }
      .progress-shell{
        width:100%;
        min-width:0;
      }
      .dialogue-box{
        left:10px;
        right:10px;
        bottom:10px;
      }
      .center-layer{ padding:12px; }
      .card{ padding:18px 16px; }
      .meta{ grid-template-columns:82px 1fr; }
      .choice-row{ flex-direction:column; }
      .choice-btn{ width:100%; }
      .criteria-label{ width:64px; font-size:13px; }
      .rubric-modal{ padding:10px; }
      .rubric-modal-card{ padding:18px 16px; }
    }
  </style>
</head>
<body>
  <div class="screen-wrap" id="game">
    <div class="background"></div>
    <div class="mood-tint" id="moodTint"></div>
    <div class="overlay" id="overlay"></div>

    <div class="hud">
      <div class="hud-left">
        <div class="badge" id="chapterLabel">오프닝</div>
        <button class="badge" id="rubricBtn" type="button">📖 기준 보기</button>
        <button class="badge" id="soundBtn" type="button">🔊</button>
      </div>
      <div class="progress-shell">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">0 / 5</div>
      </div>
    </div>

    <div class="center-layer">
      <div class="card hidden" id="card"></div>
    </div>

    <div class="dialogue-box" id="dialogueBox">
      <div class="portrait-panel">
        <img class="portrait" src="./char.png" alt="주인공 캐릭터" />
      </div>
      <div class="text-panel">
        <div class="name-tag" id="speaker">주인공</div>
        <div class="dialogue" id="dialogue"></div>
      </div>
      <div class="side-actions">
        <button class="pixel-btn" id="nextBtn">다음 ▶</button>
      </div>
    </div>

    <div class="rubric-modal" id="rubricModal">
      <div class="rubric-modal-card" id="rubricModalCard"></div>
    </div>
  </div>

  <script>
    const openingLines = [
      `○○출판사 신입사원인 당신은
한국문학 작품 선정 프로젝트를 맡게 되었다.`,
      `한국문학은 일반적으로
한국인이 한국인의 사상과 감정을
국어로 표현한 문학이라고 정의된다.`,
      `그러나 오늘날 세계화가 진행되며
사람과 문화, 언어는 국경을 넘어 끊임없이 이동하고 있다.
이러한 변화 속에서 문학 또한 다양한 모습으로 확장되고 있다.`,
      `이로 인해 다음과 같은 질문이 생긴다.

문자가 없던 시대의 구전 문학은 한국문학일까?
한문으로 쓰인 작품은 한국문학이 아닐까?
세계 여러 나라에서 다른 언어로 쓰인 작품은 어떻게 보아야 할까?`,
      `이제 다섯 작품을 통해,
언어·주체·정서라는 세 가지 기준으로
국제사회 속에서 변화하는 한국문학의 범위를 직접 판단해보자.`
    ];

    const guideLine = `각 작품의 정보를 읽고 판단하세요.
다음 화면에서 판단 기준을 먼저 확인한 뒤,
한국문학이면 O, 아니면 X를 선택하세요.`;

    const endingLines = [
      `당신은 다섯 작품을 통해
언어·주체·정서라는 세 가지 기준을 직접 적용해 보았습니다.`,
      `구비 문학과 한문 문학처럼
표면적인 기준과는 다르게 보이지만

    function ensureAudio(){
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function playTone(freq, duration, type = "sine", gainVal = 0.15){
      if (!soundOn) return;
      ensureAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      gain.gain.setValueAtTime(gainVal, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.start(now);
      osc.stop(now + duration);
    }

    function setDialogue(name, text, buttonText = "다음 ▶") {
      speakerEl.textContent = name;
      dialogueEl.classList.remove("show");
      setTimeout(() => {
        dialogueEl.textContent = text;
        dialogueEl.classList.add("show");
      }, 70);
      nextBtn.textContent = buttonText;
      nextBtn.disabled = false;
      dialogueBox.style.display = "grid";
    }

    function setProgress() {
      const current = Math.min(state.workIndex, works.length);
      progressText.textContent = `${current} / ${works.length}`;
      progressFill.style.width = `${(current / works.length) * 100}%`;
    }

    function setChapter(text) {
      chapterLabel.textContent = text;
    }

    const moodTintEl = document.getElementById("moodTint");

    function setMood(moodClass) {
      moodTintEl.classList.remove("show");
      setTimeout(() => {
        moodTintEl.className = `mood-tint show ${moodClass}`;
      }, 220);
    }

    function clearMood() {
      moodTintEl.classList.remove("show");
    }

    function openCard(html) {
      card.innerHTML = html;
      card.classList.remove("hidden");
      requestAnimationFrame(() => card.classList.add("show"));
      overlay.classList.add("dark");
      nextBtn.disabled = true;
      dialogueBox.style.display = "none";
    }

    function closeCard() {
      card.classList.remove("show");
      overlay.classList.remove("dark");
      dialogueBox.style.display = "grid";
      setTimeout(() => {
        if (card.classList.contains("show")) return;
        card.classList.add("hidden");
        card.innerHTML = "";
      }, 240);
    }

    function renderTitleCard() {
      clearMood();
      openCard(`
        <div class="title-card">
          <div class="card-badge">프로젝트 시작</div>
          <h1>한국문학 작품 선정 프로젝트</h1>
          <p>언어·주체·정서, 세 가지 기준을 바탕으로 작품 5편을 검토하고,
한국문학에 해당하는지 판단해보세요.
단순한 정답 맞히기를 넘어, 반론과 재반론을 통해
세계화와 국제사회 속에서 문학의 범위가 어떻게 달라질 수 있는지도 함께 생각해보는 게임입니다.</p>
          <button class="pixel-btn" id="startGameBtn">시작하기</button>
        </div>
      `);

      document.getElementById("startGameBtn").addEventListener("click", () => {
        closeCard();
        state.phase = "guide";
        setChapter("안내");
        setDialogue("주인공", guideLine, "판단 기준 보기 ▶");
      });
    }

    function renderRubricIntroCard() {
      openCard(`
        <div class="card-top"><div class="card-badge">판단 기준 안내</div></div>
        <h2>한국문학을 가르는 세 가지 기준</h2>
        ${rubricBodyHTML()}
        <div class="choice-row">
          <button class="pixel-btn" id="rubricStartBtn">판단 시작 ▶</button>
        </div>
      `);
      document.getElementById("rubricStartBtn").addEventListener("click", () => {
        closeCard();
        startNextWork();
      });
    }

    function renderWorkCard() {
      const work = works[state.workIndex];
      openCard(`
        <div class="card-top">
          <div class="card-badge">작품 ${state.workIndex + 1} / ${works.length}</div>
          <div class="score-chip">현재 점수 ${state.score} / ${works.length}</div>
          ${state.streak >= 2 ? `<div class="score-chip streak-chip">🔥 연속 ${state.streak}</div>` : ""}
        </div>
        <h2>${work.title}</h2>
        <div class="meta">
          <div class="label">작가</div><div class="value">${work.author}</div>
          <div class="label">언어</div><div class="value">${work.language}</div>
          <div class="label">설명</div><div class="value">${work.description}</div>
        </div>
        <div class="criteria-hint">판단할 때 떠올려보세요 → <b>① 언어</b> · <b>② 주체</b> · <b>③ 정서·내용</b></div>
        <div class="question">${work.question}</div>
        <div class="choice-row">
          <button class="choice-btn o" data-choice="O">O</button>
          <button class="choice-btn x" data-choice="X">X</button>
        </div>
      `);

      card.querySelectorAll(".choice-btn").forEach(btn => {
        btn.addEventListener("click", () => handleChoice(btn.dataset.choice));
      });
    }

    function showChoiceFlash(correct, streak, done) {
      const flash = document.createElement("div");
      flash.className = `result-flash ${correct ? "correct" : "wrong"}`;
      const text = correct
        ? (streak >= 3 ? `🔥 ${streak}연속 정답!` : streak === 2 ? "2연속 정답!" : "기준에 맞는 판단!")
        : "다시 생각해볼까?";
      flash.innerHTML = `
        <span class="result-icon">${correct ? "O" : "X"}</span>
        <span class="result-text">${text}</span>
      `;
      card.appendChild(flash);
      requestAnimationFrame(() => flash.classList.add("show"));
      setTimeout(done, 900);
    }

    function handleChoice(choice) {
      const work = works[state.workIndex];
      const correct = choice === work.correct;

      card.querySelectorAll(".choice-btn").forEach(btn => { btn.disabled = true; });
      if (correct) {
        state.score += 1;
        state.streak += 1;
        playCorrect();
        showScoreToast();
      } else {
        state.streak = 0;
        playWrong();
      }

      showChoiceFlash(correct, state.streak, () => {
        closeCard();
        state.phase = "reaction";
        setDialogue(
          "주인공",
          correct ? work.correctReaction : work.wrongReaction,
          "반론 보기 ▶"
        );
      });
    }

    function startNextWork() {
      const work = works[state.workIndex];
      setMood(work.mood);
      setChapter(`${work.moodEmoji} 작품 ${state.workIndex + 1} / ${works.length}`);
      state.phase = "workIntro";
      setDialogue("주인공", work.intro, "검토하기 ▶");
    }

    function renderExplanationCard() {
      const work = works[state.workIndex];
      const verdictWord = work.correct === "O" ? "한국문학이다" : "한국문학이 아니다";
      const isLast = state.workIndex === works.length - 1;
      openCard(`
        <div class="card-top">
          <div class="card-badge">해설 · 작품 ${state.workIndex + 1} / ${works.length}</div>
          <div class="score-chip">최종 판정: ${work.correct} (${verdictWord})</div>
        </div>
        <h2>${work.title}</h2>
        <div class="criteria-list">
          ${criteriaRowsHTML(work)}
        </div>
        <div class="question">${work.explanation}</div>
        <div class="choice-row">
          <button class="pixel-btn" id="explNextBtn">${isLast ? "엔딩 보기 ▶" : "다음 작품 ▶"}</button>
        </div>
      `);

      document.getElementById("explNextBtn").addEventListener("click", () => {
        closeCard();
        state.workIndex += 1;
        setProgress();
        if (state.workIndex < works.length) {
          startNextWork();
        } else {
          clearMood();
          state.phase = "ending";
          state.endingIndex = 0;
          setChapter("엔딩");
          setDialogue("주인공", endingLines[0], "다음 ▶");
        }
      });
    }

    function showRankCard() {
      const rank = getRank(state.score);
      openCard(`
        <div class="ending-card">
          <div class="card-badge">최종 판정 등급</div>
          <h1>${rank.title}</h1>
          <div class="ending-score">${state.score} / ${works.length}</div>
          <p>${rank.desc}</p>
          <button class="pixel-btn" id="restartBtn">다시 시작</button>
        </div>
      `);
      playFanfare();
      if (state.score === works.length) spawnConfetti();
      document.getElementById("restartBtn").addEventListener("click", resetGame);
    }

    function resetGame() {
      closeCard();
      clearMood();
      state.phase = "opening";
      state.openingIndex = 0;
      state.endingIndex = 0;
      state.workIndex = 0;
      state.score = 0;
      state.streak = 0;
      setProgress();
      setChapter("오프닝");
      setDialogue("주인공", openingLines[0], "다음 ▶");
      nextBtn.disabled = false;
    }

    rubricBtn.addEventListener("click", () => {
      rubricModalCard.innerHTML = `
        <h2 style="margin-top:0;">한국문학을 가르는 세 가지 기준</h2>
        ${rubricBodyHTML()}
        <div class="choice-row">
          <button class="pixel-btn" id="rubricCloseBtn">닫기</button>
        </div>
      `;
      rubricModal.classList.add("show");
      document.getElementById("rubricCloseBtn").addEventListener("click", () => {
        rubricModal.classList.remove("show");
      });
    });

    nextBtn.addEventListener("click", () => {
      switch (state.phase) {
        case "opening":
          if (state.openingIndex < openingLines.length - 1) {
            state.openingIndex += 1;
            setDialogue(
              "주인공",
              openingLines[state.openingIndex],
              state.openingIndex === openingLines.length - 1 ? "계속 ▶" : "다음 ▶"
            );
          } else {
            state.phase = "titleWait";
            renderTitleCard();
          }
          break;

        case "guide":
          state.phase = "rubricIntro";
          renderRubricIntroCard();
          break;

        case "workIntro":
          state.phase = "choice";
          renderWorkCard();
          break;

        case "reaction":
          state.phase = "counter";
          setDialogue("반대 의견", works[state.workIndex].counterArgument, "재반론 보기 ▶");
          break;

        case "counter":
          state.phase = "rebuttal";
          setDialogue("주인공", works[state.workIndex].rebuttal, "기준 정리 보기 ▶");
          break;

        case "rebuttal":
          state.phase = "explanation";
          renderExplanationCard();
          break;

        case "ending":
          if (state.endingIndex < endingLines.length - 1) {
            state.endingIndex += 1;
            setDialogue(
              "주인공",
              endingLines[state.endingIndex],
              state.endingIndex === endingLines.length - 1 ? "결과 확인 ▶" : "다음 ▶"
            );
          } else {
            state.phase = "rankReveal";
            showRankCard();
          }
          break;
      }
    });

    setChapter("오프닝");
    setProgress();
    setDialogue("주인공", openingLines[0], "다음 ▶");
  </script>
</body>
</html>
